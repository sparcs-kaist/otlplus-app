name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.32.x"
  JAVA_VERSION: "17"
  XCODE_VERSION: "Xcode_16.4"
  POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
  POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Create key.properties
        run: |
          echo "storeFile=../ci.jks" > android/key.properties
          echo "storePassword=123456" >> android/key.properties
          echo "keyPassword=123456" >> android/key.properties
          echo "keyAlias=ci" >> android/key.properties
      - name: Install dependencies
        run: flutter pub get
      - name: Set Gradle JVM options for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
      - name: Build APK
        run: >-
          flutter build apk --release
          --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY"
          --dart-define=POSTHOG_HOST="$POSTHOG_HOST"

  build-ios:
    name: Build iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/${{ env.XCODE_VERSION }}.app/Contents/Developer'
      - name: Verify iOS SDK
        run: |
          xcodebuild -showsdks 2>/dev/null | grep -i iphoneos || true
          xcrun --sdk iphoneos --show-sdk-path
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY"
          --dart-define=POSTHOG_HOST="$POSTHOG_HOST"
