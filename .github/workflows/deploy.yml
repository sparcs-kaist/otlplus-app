name: Deploy to Stores

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: "Store deployment target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios

env:
  FLUTTER_VERSION: "3.44.x"
  JAVA_VERSION: "17"
  XCODE_VERSION: "Xcode_26.3"

jobs:
  
  deploy-android:
    if: >-
      ${{
        (github.event_name == 'push' && !contains(github.ref_name, '-ios-only')) ||
        (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && (inputs.platform == 'all' || inputs.platform == 'android'))
      }}
    environment: Release
    name: Deploy Android to Google Play
    runs-on: ubuntu-latest
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
          working-directory: android

      - name: Install Ruby dependencies
        working-directory: android
        run: |
          gem install bundler
          bundle config set --local deployment false
          bundle install --jobs 4 --retry 3

      - name: Debug GitHub Secrets
        run: |
          echo "🔍 Debugging GitHub Secrets availability..."
          
          # Check environment variables (safer than direct secret access)
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            secret_length=$(echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | wc -c)
            echo "✅ GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: Available ($secret_length characters)"
          else
            echo "❌ GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: Not set or empty"
          fi
          
          if [ -n "$ANDROID_KEYSTORE" ]; then
            keystore_length=$(echo "$ANDROID_KEYSTORE" | wc -c)
            echo "✅ ANDROID_KEYSTORE: Available ($keystore_length characters)"
          else
            echo "❌ ANDROID_KEYSTORE: Not set or empty"
          fi
          
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "✅ ANDROID_KEYSTORE_PASSWORD: Available"
          else
            echo "❌ ANDROID_KEYSTORE_PASSWORD: Not set or empty"
          fi
          
          if [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "✅ ANDROID_KEY_ALIAS: Available ($ANDROID_KEY_ALIAS)"
          else
            echo "❌ ANDROID_KEY_ALIAS: Not set or empty"
          fi
          
          if [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "✅ ANDROID_KEY_PASSWORD: Available"
          else
            echo "❌ ANDROID_KEY_PASSWORD: Not set or empty"
          fi
          
          echo "🎯 Required secrets check completed!"

      - name: Create Google Play service account JSON
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ ERROR: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not set!"
            echo "Please add this secret in GitHub Repository Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > android/fastlane/otlplus-fastlane.json
          echo "✅ Google Play service account JSON created"

      - name: Decode and create keystore
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "❌ ERROR: ANDROID_KEYSTORE secret is not set!"
            echo "Please add this secret in GitHub Repository Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > android/fastlane/upload-keystore.jks
          echo "✅ Android keystore decoded"

      - name: Validate Android Keystore
        run: |
          echo "🔍 Validating Android Keystore..."
          
          # 1. Check if keystore file exists
          if [ ! -f android/fastlane/upload-keystore.jks ]; then
            echo "❌ ERROR: Keystore file not found"
            exit 1
          fi
          
          # 2. Check file size (should be > 1KB for a valid keystore)
          file_size=$(stat -c%s android/fastlane/upload-keystore.jks 2>/dev/null || stat -f%z android/fastlane/upload-keystore.jks)
          echo "📦 Keystore file size: $file_size bytes"
          if [ "$file_size" -lt 1000 ]; then
            echo "❌ ERROR: Keystore file too small ($file_size bytes), likely corrupted"
            exit 1
          fi
          
          # 3. Check if it's a valid keystore format
          file_type=$(file android/fastlane/upload-keystore.jks)
          echo "📄 File type: $file_type"
          if [[ ! "$file_type" == *"Java KeyStore"* ]] && [[ ! "$file_type" == *"data"* ]]; then
            echo "⚠️  WARNING: File type might not be a valid keystore"
          fi
          
          # 4. Test keystore with keytool (list contents)
          echo "🔐 Testing keystore accessibility..."
          if keytool -list -keystore android/fastlane/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -v > /dev/null 2>&1; then
            echo "✅ Keystore is accessible with provided password"
          else
            echo "❌ ERROR: Cannot access keystore with provided password"
            echo "Possible causes:"
            echo "  - Wrong ANDROID_KEYSTORE_PASSWORD"
            echo "  - Corrupted keystore file"
            echo "  - Invalid base64 encoding"
            exit 1
          fi
          
          # 5. Check if specific alias exists
          echo "🔑 Checking for alias '$ANDROID_KEY_ALIAS'..."
          if keytool -list -keystore android/fastlane/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "✅ Alias '$ANDROID_KEY_ALIAS' found in keystore"
          else
            echo "❌ ERROR: Alias '$ANDROID_KEY_ALIAS' not found in keystore"
            echo "Available aliases:"
            keytool -list -keystore android/fastlane/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep "Alias name:" || echo "Could not list aliases"
            exit 1
          fi
          
          # 6. Test key password
          echo "🔓 Testing key password..."
          if keytool -list -keystore android/fastlane/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" > /dev/null 2>&1; then
            echo "✅ Key password is correct"
          else
            echo "❌ ERROR: Wrong key password for alias '$ANDROID_KEY_ALIAS'"
            exit 1
          fi
          
          # 7. Display keystore summary
          echo "📋 Keystore validation summary:"
          echo "  • File size: $file_size bytes"
          echo "  • Store password: ✅ Valid"
          echo "  • Alias '$ANDROID_KEY_ALIAS': ✅ Found"
          echo "  • Key password: ✅ Valid"
          echo "🎉 All keystore validations passed!"

      - name: Create key.properties
        run: |
          echo "storeFile=../fastlane/upload-keystore.jks" > android/key.properties
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
      - name: Create Sentry environment file
        run: |
          echo "auth_token=$SENTRY_AUTH_TOKEN" > sentry.properties
          echo "✅ Sentry environment file created" 
      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Load release secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPER_TOKEN }}
          inject-env-vars: true

      - name: Map release configuration
        run: |
          if [ -z "${POSTHOG_APP_TOKEN:-}" ]; then
            echo "::error::POSTHOG_APP_TOKEN is not available in Doppler"
            exit 1
          fi
          echo "POSTHOG_API_KEY=$POSTHOG_APP_TOKEN" >> "$GITHUB_ENV"
          echo "POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}" >> "$GITHUB_ENV"

      - name: Set app version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ruby -i -pe "\$_ = \"version: ${VERSION}+1\n\" if \$_.start_with?('version:')" pubspec.yaml
          else
            echo "Ref '${GITHUB_REF_NAME}' has no semantic version; keeping pubspec version"
          fi
          grep '^version:' pubspec.yaml

      - name: Setup Android NDK
        run: |
          echo "🔧 Setting up Android NDK..."
          # Install NDK version compatible with Flutter
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" || true
          # Set NDK environment variable
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          # Also set ndk.dir in local.properties for Gradle
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> android/local.properties
          echo "✅ Android NDK setup complete"

      - name: Set Gradle JVM options for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties

      - name: Deploy to Google Play Production
        working-directory: android
        run: bundle exec fastlane production

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f android/fastlane/otlplus-fastlane.json
          rm -f android/fastlane/upload-keystore.jks
          rm -f android/key.properties

      - name: Notify Slack
        if: always() && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} ${{ github.workflow }} — Android — ${{ github.ref_name }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy-ios:
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && (inputs.platform == 'all' || inputs.platform == 'ios'))
      }}
    environment: Release
    name: Deploy iOS to TestFlight
    runs-on: macos-15
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATES_P12: ${{ secrets.IOS_CERTIFICATES_P12 }}
      IOS_CERTIFICATES_PASSWORD: ${{ secrets.IOS_CERTIFICATES_PASSWORD }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      IOS_PROVISIONING_PROFILE_WIDGET: ${{ secrets.IOS_PROVISIONING_PROFILE_WIDGET }}
      IOS_PROVISIONING_PROFILE_INTENTS: ${{ secrets.IOS_PROVISIONING_PROFILE_INTENTS }}
      IOS_PROVISIONING_PROFILE_WATCH: ${{ secrets.IOS_PROVISIONING_PROFILE_WATCH }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/${{ env.XCODE_VERSION }}.app/Contents/Developer'

      - name: Install iOS SDK Platform
        run: |
          # Check if iOS SDK is available
          echo "🔍 Checking iOS SDK availability..."
          xcodebuild -showsdks
          
          # Download iOS platform if needed (this includes device SDK, not just simulator)
          echo "📥 Downloading iOS platform..."
          xcodebuild -downloadPlatform iOS -quiet || true
          
          # Wait for download to complete
          sleep 10
          
          # Show available destinations
          echo "📋 Available destinations:"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -showdestinations 2>/dev/null | head -20 || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
          working-directory: ios

      - name: Install Ruby dependencies
        working-directory: ios
        run: |
          gem install bundler
          bundle config set --local deployment false
          bundle install --jobs 4 --retry 3

      - name: Debug iOS Secrets
        run: |
          echo "🔍 Debugging iOS Secrets availability..."
          
          if [ -n "$APPLE_ID" ]; then
            echo "✅ APPLE_ID: Available"
          else
            echo "❌ APPLE_ID: Not set or empty"
          fi
          
          if [ -n "$APPLE_PASSWORD" ]; then
            echo "✅ APPLE_PASSWORD: Available"
          else
            echo "❌ APPLE_PASSWORD: Not set or empty"
          fi
          
          if [ -n "$APPLE_TEAM_ID" ]; then
            echo "✅ APPLE_TEAM_ID: Available ($APPLE_TEAM_ID)"
          else
            echo "❌ APPLE_TEAM_ID: Not set or empty"
          fi
          
          if [ -n "$IOS_CERTIFICATES_P12" ]; then
            cert_length=$(echo "$IOS_CERTIFICATES_P12" | wc -c)
            echo "✅ IOS_CERTIFICATES_P12: Available ($cert_length characters)"
          else
            echo "❌ IOS_CERTIFICATES_P12: Not set or empty"
          fi
          
          if [ -n "$IOS_CERTIFICATES_PASSWORD" ]; then
            echo "✅ IOS_CERTIFICATES_PASSWORD: Available"
          else
            echo "❌ IOS_CERTIFICATES_PASSWORD: Not set or empty"
          fi
          
          if [ -n "$IOS_PROVISIONING_PROFILE" ]; then
            profile_length=$(echo "$IOS_PROVISIONING_PROFILE" | wc -c)
            echo "✅ IOS_PROVISIONING_PROFILE: Available ($profile_length characters)"
          else
            echo "❌ IOS_PROVISIONING_PROFILE: Not set or empty"
          fi
          
          if [ -n "$IOS_PROVISIONING_PROFILE_WIDGET" ]; then
            profile_length=$(echo "$IOS_PROVISIONING_PROFILE_WIDGET" | wc -c)
            echo "✅ IOS_PROVISIONING_PROFILE_WIDGET: Available ($profile_length characters)"
          else
            echo "⚠️  IOS_PROVISIONING_PROFILE_WIDGET: Not set (Widget extension may fail)"
          fi
          
          if [ -n "$IOS_PROVISIONING_PROFILE_INTENTS" ]; then
            profile_length=$(echo "$IOS_PROVISIONING_PROFILE_INTENTS" | wc -c)
            echo "✅ IOS_PROVISIONING_PROFILE_INTENTS: Available ($profile_length characters)"
          else
            echo "⚠️  IOS_PROVISIONING_PROFILE_INTENTS: Not set (Intents extension may fail)"
          fi

          if [ -n "$IOS_PROVISIONING_PROFILE_WATCH" ]; then
            profile_length=$(echo "$IOS_PROVISIONING_PROFILE_WATCH" | wc -c)
            echo "✅ IOS_PROVISIONING_PROFILE_WATCH: Available ($profile_length characters)"
          else
            echo "⚠️  IOS_PROVISIONING_PROFILE_WATCH: Not set (Watch app may fail)"
          fi

      - name: Create Fastlane environment file
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "❌ ERROR: Required Apple secrets are not set!"
            echo "Please add APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID in GitHub Repository Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "FASTLANE_USER=$APPLE_ID" > ios/fastlane/.env.default
          echo "FASTLANE_PASSWORD=$APPLE_PASSWORD" >> ios/fastlane/.env.default
          echo "FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD=$APPLE_PASSWORD" >> ios/fastlane/.env.default
          echo "FASTLANE_TEAM_ID=$APPLE_TEAM_ID" >> ios/fastlane/.env.default
          echo "✅ Fastlane environment file created"
      - name: Create Sentry environment file
        run: |
          echo "auth_token=$SENTRY_AUTH_TOKEN" > sentry.properties
          echo "✅ Sentry environment file created"

      - name: Import iOS certificates and provisioning profiles
        run: |
          # 키체인 생성
          security create-keychain -p "temp_password" build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security unlock-keychain -p "temp_password" build.keychain
          
          # 인증서 디코딩 및 검증
          echo "🔍 Validating iOS certificate..."
          echo "$IOS_CERTIFICATES_P12" | base64 -d > certificates.p12
          
          # P12 파일 크기 검증
          cert_size=$(stat -f%z certificates.p12)
          echo "📦 Certificate file size: $cert_size bytes"
          if [ "$cert_size" -lt 1000 ]; then
            echo "❌ ERROR: Certificate file too small ($cert_size bytes), likely corrupted"
            exit 1
          fi
          
          # P12 파일 유효성 검증
          if openssl pkcs12 -info -in certificates.p12 -passin pass:"$IOS_CERTIFICATES_PASSWORD" -noout > /dev/null 2>&1; then
            echo "✅ P12 certificate is valid and password is correct"
          else
            echo "❌ ERROR: Invalid P12 certificate or wrong password"
            exit 1
          fi
          
          # Repack with algorithms accepted by macOS Security.framework.
          bash .github/scripts/repack-ios-certificate.sh certificates.p12 compatible-certificates.p12
          security import compatible-certificates.p12 -k build.keychain -P "$IOS_CERTIFICATES_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp_password" build.keychain
          
          # 프로비저닝 프로파일 검증 및 설치
          echo "🔍 Validating provisioning profiles..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # Main app profile
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          
          # 프로비저닝 프로파일 크기 검증
          profile_size=$(stat -f%z ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision)
          echo "📱 Main provisioning profile size: $profile_size bytes"
          if [ "$profile_size" -lt 1000 ]; then
            echo "❌ ERROR: Provisioning profile too small ($profile_size bytes), likely corrupted"
            exit 1
          fi
          
          # Widget extension profile (optional)
          if [ -n "$IOS_PROVISIONING_PROFILE_WIDGET" ]; then
            echo "$IOS_PROVISIONING_PROFILE_WIDGET" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile_widget.mobileprovision
            widget_size=$(stat -f%z ~/Library/MobileDevice/Provisioning\ Profiles/profile_widget.mobileprovision)
            echo "📱 Widget provisioning profile size: $widget_size bytes"
          else
            echo "⚠️  No Widget provisioning profile provided"
          fi
          
          # Intents extension profile (optional)
          if [ -n "$IOS_PROVISIONING_PROFILE_INTENTS" ]; then
            echo "$IOS_PROVISIONING_PROFILE_INTENTS" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile_intents.mobileprovision
            intents_size=$(stat -f%z ~/Library/MobileDevice/Provisioning\ Profiles/profile_intents.mobileprovision)
            echo "📱 Intents provisioning profile size: $intents_size bytes"
          else
            echo "⚠️  No Intents provisioning profile provided"
          fi

          # Watch app profile (optional)
          if [ -n "$IOS_PROVISIONING_PROFILE_WATCH" ]; then
            echo "$IOS_PROVISIONING_PROFILE_WATCH" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile_watch.mobileprovision
            watch_size=$(stat -f%z ~/Library/MobileDevice/Provisioning\ Profiles/profile_watch.mobileprovision)
            echo "⌚ Watch provisioning profile size: $watch_size bytes"
          else
            echo "⚠️  No Watch provisioning profile provided"
          fi
          
          # 프로비저닝 프로파일 내용 검증
          if security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision > /dev/null 2>&1; then
            echo "✅ Provisioning profile is valid"
            # Bundle ID 확인
            bundle_id=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision | grep -A1 "application-identifier" | grep "string" | sed 's/.*<string>//g' | sed 's/<\/string>.*//g' | sed 's/.*\.//g')
            echo "📋 Bundle ID from profile: $bundle_id"
          else
            echo "❌ ERROR: Invalid provisioning profile"
            exit 1
          fi
          
          # 키체인에서 인증서 확인
          echo "🔑 Verifying certificate in keychain..."
          echo "📋 Available certificates in keychain:"
          security find-identity -v -p codesigning build.keychain
          
          echo "🎉 All iOS certificate and profile validations passed!"

      - name: Extract provisioning profile metadata
        run: |
          set -euo pipefail
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          extract_field() {
            local file="$1"
            local field="$2"
            if [ ! -f "$file" ]; then
              echo ""
              return
            fi
            security cms -D -i "$file" 2>/dev/null \
              | plutil -extract "$field" raw - 2>/dev/null \
              || true
          }

          install_by_uuid() {
            local file="$1"
            local uuid
            uuid=$(extract_field "$file" UUID)
            if [ -n "$uuid" ]; then
              cp "$file" "$PP_DIR/$uuid.mobileprovision"
            fi
            echo "$uuid"
          }

          validate_profile() {
            local label="$1"
            local name="$2"
            local uuid="$3"
            local expiration="$4"

            if [ -z "$name" ] || [ -z "$uuid" ] || [ -z "$expiration" ]; then
              echo "❌ ERROR: $label provisioning profile metadata is incomplete."
              echo "       name=${name:-<missing>}, uuid=${uuid:-<missing>}, expiration=${expiration:-<missing>}"
              exit 1
            fi

            expiration_epoch=$(ruby -rtime -e 'puts Time.parse(ARGV[0]).to_i' "$expiration")
            now_epoch=$(date +%s)
            if [ "$expiration_epoch" -le "$now_epoch" ]; then
              echo "❌ ERROR: $label provisioning profile has expired: $name ($expiration)"
              echo "       Refresh the corresponding IOS_PROVISIONING_PROFILE* GitHub secret in the Release environment."
              exit 1
            fi
          }

          MAIN_PROFILE="$PP_DIR/profile.mobileprovision"
          WIDGET_PROFILE="$PP_DIR/profile_widget.mobileprovision"
          INTENTS_PROFILE="$PP_DIR/profile_intents.mobileprovision"
          WATCH_PROFILE="$PP_DIR/profile_watch.mobileprovision"

          MAIN_NAME=$(extract_field "$MAIN_PROFILE" Name)
          WIDGET_NAME=$(extract_field "$WIDGET_PROFILE" Name)
          INTENTS_NAME=$(extract_field "$INTENTS_PROFILE" Name)
          WATCH_NAME=$(extract_field "$WATCH_PROFILE" Name)
          MAIN_UUID=$(install_by_uuid "$MAIN_PROFILE")
          WIDGET_UUID=$(install_by_uuid "$WIDGET_PROFILE")
          INTENTS_UUID=$(install_by_uuid "$INTENTS_PROFILE")
          WATCH_UUID=$(install_by_uuid "$WATCH_PROFILE")
          MAIN_EXPIRATION=$(extract_field "$MAIN_PROFILE" ExpirationDate)
          WIDGET_EXPIRATION=$(extract_field "$WIDGET_PROFILE" ExpirationDate)
          INTENTS_EXPIRATION=$(extract_field "$INTENTS_PROFILE" ExpirationDate)
          WATCH_EXPIRATION=$(extract_field "$WATCH_PROFILE" ExpirationDate)

          echo "📋 Extracted profile metadata:"
          echo "  • Main:    ${MAIN_NAME:-<missing>} (${MAIN_UUID:-missing UUID}) expires ${MAIN_EXPIRATION:-<missing>}"
          echo "  • Widget:  ${WIDGET_NAME:-<missing>} (${WIDGET_UUID:-missing UUID}) expires ${WIDGET_EXPIRATION:-<missing>}"
          echo "  • Intents: ${INTENTS_NAME:-<missing>} (${INTENTS_UUID:-missing UUID}) expires ${INTENTS_EXPIRATION:-<missing>}"
          echo "  • Watch:   ${WATCH_NAME:-<missing>} (${WATCH_UUID:-missing UUID}) expires ${WATCH_EXPIRATION:-<missing>}"

          validate_profile "Main" "$MAIN_NAME" "$MAIN_UUID" "$MAIN_EXPIRATION"
          validate_profile "Widget" "$WIDGET_NAME" "$WIDGET_UUID" "$WIDGET_EXPIRATION"
          validate_profile "Intents" "$INTENTS_NAME" "$INTENTS_UUID" "$INTENTS_EXPIRATION"
          # Watch profile is optional: when any profile is absent the
          # Fastfile intentionally falls back to legacy code signing, so a
          # missing watch profile must not fail the whole deployment.
          if [ -n "$WATCH_NAME" ]; then
            validate_profile "Watch" "$WATCH_NAME" "$WATCH_UUID" "$WATCH_EXPIRATION"
          else
            echo "⚠️  Watch provisioning profile not set; Fastfile will fall back to legacy signing"
          fi

          {
            echo "IOS_PROFILE_NAME=$MAIN_NAME"
            echo "IOS_WIDGET_PROFILE_NAME=$WIDGET_NAME"
            echo "IOS_INTENTS_PROFILE_NAME=$INTENTS_NAME"
            echo "IOS_WATCH_PROFILE_NAME=$WATCH_NAME"
            echo "IOS_PROFILE_UUID=$MAIN_UUID"
            echo "IOS_WIDGET_PROFILE_UUID=$WIDGET_UUID"
            echo "IOS_INTENTS_PROFILE_UUID=$INTENTS_UUID"
            echo "IOS_WATCH_PROFILE_UUID=$WATCH_UUID"
          } >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Load release secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPER_TOKEN }}
          inject-env-vars: true

      - name: Map release configuration
        run: |
          if [ -z "${POSTHOG_APP_TOKEN:-}" ]; then
            echo "::error::POSTHOG_APP_TOKEN is not available in Doppler"
            exit 1
          fi
          echo "POSTHOG_API_KEY=$POSTHOG_APP_TOKEN" >> "$GITHUB_ENV"
          echo "POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}" >> "$GITHUB_ENV"

      - name: Set app version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ruby -i -pe "\$_ = \"version: ${VERSION}+1\n\" if \$_.start_with?('version:')" pubspec.yaml
          else
            echo "Ref '${GITHUB_REF_NAME}' has no semantic version; keeping pubspec version"
          fi
          grep '^version:' pubspec.yaml

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Debug App Store Connect API key availability
        run: |
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "✅ App Store Connect API key is configured — TestFlight upload will use API key auth"
          else
            echo "⚠️  App Store Connect API key NOT fully configured — falling back to APPLE_ID + APPLE_PASSWORD auth"
            echo "   This often fails when 2FA is enabled or APPLE_PASSWORD is not an app-specific password."
            echo "   To fix: add these GitHub secrets:"
            echo "     - APP_STORE_CONNECT_KEY_ID"
            echo "     - APP_STORE_CONNECT_ISSUER_ID"
            echo "     - APP_STORE_CONNECT_API_KEY  (.p8 file content, raw or base64)"
          fi

      - name: Deploy to TestFlight
        working-directory: ios
        run: bundle exec fastlane alpha

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f ios/fastlane/.env.default
          rm -f certificates.p12
          rm -f compatible-certificates.p12
          security delete-keychain build.keychain || true

      - name: Notify Slack
        if: always() && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} ${{ github.workflow }} — iOS — ${{ github.ref_name }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
