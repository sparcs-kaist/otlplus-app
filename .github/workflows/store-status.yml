name: Store Review Status

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Store to check"
        required: true
        default: "both"
        type: choice
        options: [android, ios, both]

permissions:
  contents: read

jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    environment: Release
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Load release secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPER_TOKEN }}
          inject-env-vars: true
      - name: Map release configuration
        run: echo "POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android
      - name: Write Google Play credentials
        run: |
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > android/fastlane/otlplus-fastlane.json
      - name: Read production status
        id: status
        working-directory: android
        run: |
          set -o pipefail
          bundle exec fastlane review_status | tee status.txt
      - name: Extract review state
        if: always()
        id: state
        working-directory: android
        run: |
          STATE=$(grep -E '^state=' status.txt 2>/dev/null | head -1 | cut -d= -f2- || true)
          echo "state=${STATE:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        if: always() && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: "${{ job.status == 'success' && ':information_source:' || ':x:' }} Google Play status check — ${{ github.repository }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — state: ${{ steps.state.outputs.state }}"
      - name: Clean credentials
        if: always()
        run: rm -f android/fastlane/otlplus-fastlane.json

  ios:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-15
    environment: Release
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_IDENTIFIER: org.sparcs.otlplus
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Load release secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPER_TOKEN }}
          inject-env-vars: true
      - name: Map release configuration
        run: echo "POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios
      - name: Read App Store status
        id: status
        working-directory: ios
        run: |
          set -o pipefail
          bundle exec fastlane review_status | tee status.txt
      - name: Extract review state
        if: always()
        id: state
        working-directory: ios
        run: |
          STATE=$(grep -E '^state=' status.txt 2>/dev/null | head -1 | cut -d= -f2- || true)
          echo "state=${STATE:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        if: always() && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: "${{ job.status == 'success' && ':information_source:' || ':x:' }} App Store status check — ${{ github.repository }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — state: ${{ steps.state.outputs.state }}"
