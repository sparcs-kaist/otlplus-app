name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run integration tests on"
        required: false
        default: "both"
        type: choice
        options: [android, ios, both]

env:
  FLUTTER_VERSION: "3.44.x"
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "34"
  XCODE_VERSION: "Xcode_26.3"
  IOS_DEVICE: "iPhone 16 Pro"

jobs:
  unit:
    name: Unit & Widget Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test

  integration-android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'android' || inputs.platform == 'both' }}
    name: Integration Test (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          script: flutter test integration_test/smoke_test.dart --dart-define=APP_SMOKE_TEST=true

  integration-ios:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ios' || inputs.platform == 'both' }}
    name: Integration Test (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/${{ env.XCODE_VERSION }}.app/Contents/Developer"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Boot simulator
        run: |
          UDID=$(xcrun xctrace list devices 2>&1 | awk '/${{ env.IOS_DEVICE }}/ {print $NF; exit}' | tr -d '()')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
      - name: Warm up simulator build
        run: flutter build ios --simulator --debug -d "$UDID" --dart-define=APP_SMOKE_TEST=true
      - name: Integration test
        run: flutter test --timeout 20m integration_test/smoke_test.dart -d "$UDID" --dart-define=APP_SMOKE_TEST=true
      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all

  e2e-android:
    # Fork PRs must never receive the Doppler secrets; same-repo branch PRs,
    # push-to-main, and manual dispatch do.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Authenticated E2E (Android)
    runs-on: ubuntu-latest
    # One test account: concurrent logins would rotate each other's refresh
    # tokens, so authenticated runs are serialized across jobs and runs.
    concurrency:
      group: e2e-sso-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fetch SSO test credentials
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPER_TOKEN }}
          inject-env-vars: true
      - name: Preflight credentials
        run: |
          if [ -z "${TEST_SSO_EMAIL:-}" ] || [ -z "${TEST_SSO_PASSWORD:-}" ]; then
            echo "::error::TEST_SSO_EMAIL / TEST_SSO_PASSWORD are not present in the Doppler config referenced by DOPPLER_TOKEN"
            exit 1
          fi
      - name: Authenticated integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          script: flutter test integration_test/authenticated_flow_test.dart --timeout 15m --dart-define=APP_SMOKE_TEST=true --dart-define=TEST_SSO_EMAIL="$TEST_SSO_EMAIL" --dart-define=TEST_SSO_PASSWORD="$TEST_SSO_PASSWORD"

  e2e-ios:
    needs: e2e-android
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Authenticated E2E (iOS)
    runs-on: macos-15
    concurrency:
      group: e2e-sso-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/${{ env.XCODE_VERSION }}.app/Contents/Developer"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Boot simulator
        run: |
          UDID=$(xcrun xctrace list devices 2>&1 | awk '/${{ env.IOS_DEVICE }}/ {print $NF; exit}' | tr -d '()')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
      - name: Fetch SSO test credentials
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPER_TOKEN }}
          inject-env-vars: true
      - name: Preflight credentials
        run: |
          if [ -z "${TEST_SSO_EMAIL:-}" ] || [ -z "${TEST_SSO_PASSWORD:-}" ]; then
            echo "::error::TEST_SSO_EMAIL / TEST_SSO_PASSWORD are not present in the Doppler config referenced by DOPPLER_TOKEN"
            exit 1
          fi
      - name: Warm up simulator build
        run: flutter build ios --simulator --debug -d "$UDID" --dart-define=APP_SMOKE_TEST=true --dart-define=TEST_SSO_EMAIL="$TEST_SSO_EMAIL" --dart-define=TEST_SSO_PASSWORD="$TEST_SSO_PASSWORD"
      - name: Authenticated integration test
        run: flutter test --timeout 20m integration_test/authenticated_flow_test.dart -d "$UDID" --dart-define=APP_SMOKE_TEST=true --dart-define=TEST_SSO_EMAIL="$TEST_SSO_EMAIL" --dart-define=TEST_SSO_PASSWORD="$TEST_SSO_PASSWORD"
      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all
